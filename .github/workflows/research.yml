name: Research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python tests/test_pdp.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python eval/verify_walkthrough.py
      - run: python eval/correction_scope_demo.py validate
      - run: python eval/build_correction_pilot.py validate
      - run: git diff --check
