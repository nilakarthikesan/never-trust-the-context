[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "never-trust-the-context"
version = "0.2.0"
description = "Research tooling for source support, evidence correction, and bounded agent decisions"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["PyYAML>=6.0"]
legacy-models = ["openai>=1.0", "jinja2>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
